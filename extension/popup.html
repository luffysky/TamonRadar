<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 8px; color: #2f5597; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 8px; background: #2f5597; color: #fff; font-size: 13px; cursor: pointer; }
    label { font-size: 11px; color: #64748b; display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>📡 TamonRadar 快搜</h1>
  <input id="q" placeholder="輸入關鍵字搜尋…" />
  <button id="go">搜尋</button>
  <label>網站網址</label>
  <input id="site" placeholder="https://tamonradar.snowrealm.pet" />
  <button id="save" style="background:#64748b">儲存網址</button>
  <script src="popup.js"></script>
</body>
</html>
